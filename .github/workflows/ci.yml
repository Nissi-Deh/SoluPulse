# Intégration continue (cahier des charges §6.5) : compilation, tests et couverture,
# puis installeur MSI, signé si le certificat est configuré dans les secrets du dépôt.
# Une étiquette v<version> publie en plus la version sur la page des versions GitHub.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Compilation et tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restauration
        run: dotnet restore SoluPulse.sln

      - name: Compilation
        run: dotnet build SoluPulse.sln -c Release --no-restore -warnaserror

      - name: Tests et couverture
        run: >
          dotnet test SoluPulse.sln -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          --logger "trx;LogFilePrefix=resultats"

      - name: Rapport de couverture
        if: always()
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:TestResults/couverture -reporttypes:"MarkdownSummaryGithub;Html"
          Get-Content TestResults/couverture/SummaryGithub.md >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resultats-tests
          path: TestResults

  installer:
    name: Installeur MSI
    runs-on: windows-latest
    needs: build-test
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      HAS_SIGNING_CERT: ${{ secrets.SIGNING_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Le certificat (PFX en base 64) et son mot de passe sont des secrets du dépôt.
      # Sans eux, l'installeur est produit non signé : utilisable pour les tests, jamais pour une diffusion.
      - name: Import du certificat de signature
        id: certificate
        if: env.HAS_SIGNING_CERT == 'true'
        shell: pwsh
        env:
          SIGNING_CERT: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signature.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERT))
          $password = ConvertTo-SecureString $env:SIGNING_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT

      # Numéro de l'étiquette pour une publication (v1.2.0 → 1.2.0), sinon 1.0.<numéro d'exécution>.
      - name: Construction de l'installeur
        shell: pwsh
        env:
          SOLUPULSE_SIGN_THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "1.0.${{ github.run_number }}" }
          ./build/build-installer.ps1 -Version $version

      # Le script télécharge l'installeur officiel de PawnIO et vérifie sa signature Authenticode.
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: installeur
          path: |
            artifacts/installer/*.msi
            artifacts/installer/SoluPulse-Setup-*.exe

  # Signature gratuite par SignPath Foundation (docs/signature.md). Active dès que le secret
  # SIGNPATH_API_TOKEN et la variable SIGNPATH_ORGANIZATION_ID sont configurés ; chaque demande
  # attend l'approbation manuelle dans SignPath.
  signature:
    name: Signature SignPath
    runs-on: ubuntu-latest
    needs: installer
    if: (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && vars.SIGNPATH_ORGANIZATION_ID != ''
    steps:
      - uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: SoluPulse
          signing-policy-slug: release-signing
          github-artifact-id: ${{ needs.installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signe

      - uses: actions/upload-artifact@v7
        with:
          name: installeur-signe
          path: signe

  # Page de version GitHub, uniquement pour une étiquette v<version>. Elle reprend l'installeur
  # signé quand la signature SignPath a tourné, sinon l'installeur non signé, publié en préversion.
  publication:
    name: Publication de la version
    runs-on: ubuntu-latest
    needs: [installer, signature]
    if: always() && github.ref_type == 'tag' && needs.installer.result == 'success' && (needs.signature.result == 'success' || needs.signature.result == 'skipped')
    permissions:
      contents: write
    steps:
      - name: Récupération de l'installeur
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ needs.signature.result == 'success' }}
        run: |
          name=installeur
          if [ "$SIGNED" = "true" ]; then name=installeur-signe; fi
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$name" --dir dist
          ls -l dist

      - name: Création de la version
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ needs.signature.result == 'success' }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "## SoluPulse $version"
            echo
            echo "Téléchargez **SoluPulse-Setup-$version.exe** et lancez-le (Windows 10 22H2 ou Windows 11, 64 bits)."
            echo "Le fichier MSI installe SoluPulse seul, sans le pilote PawnIO des capteurs du processeur."
            echo
            if [ "$SIGNED" = "true" ]; then
              echo "Signature de code gratuite fournie par [SignPath.io](https://signpath.io), certificat de [SignPath Foundation](https://signpath.org)."
              echo
              echo "Free code signing provided by SignPath.io, certificate by SignPath Foundation."
            else
              echo "Cette version n'est pas encore signée : Windows affiche « Éditeur inconnu ». Cliquez sur **Informations complémentaires**, puis **Exécuter quand même**."
              echo "La signature gratuite sera fournie par [SignPath Foundation](https://signpath.org) : voir la [politique de signature](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/politique-signature.md)."
            fi
          } > notes.md
          flags=""
          if [ "$SIGNED" != "true" ]; then flags="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "SoluPulse $version" --notes-file notes.md --generate-notes $flags
